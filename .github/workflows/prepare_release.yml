name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'New Version Name (ex: 1.1.0)'
        required: true
        type: string

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Update build.gradle.kts
        run: |
          NEW_VERSION="${{ inputs.version_name }}"
          
          # Ler o versionCode atual e incrementar
          CURRENT_CODE=$(grep 'versionCode =' app/build.gradle.kts | awk '{print $3}')
          NEW_CODE=$((CURRENT_CODE + 1))
          
          echo "Updating build.gradle.kts:"
          echo "  Old VersionCode: $CURRENT_CODE -> New: $NEW_CODE"
          echo "  New VersionName: $NEW_VERSION"
          
          # Atualizar versionName
          sed -i "s/versionName = \".*\"/versionName = \"$NEW_VERSION\"/" app/build.gradle.kts
          
          # Atualizar versionCode
          sed -i "s/versionCode = .*/versionCode = $NEW_CODE/" app/build.gradle.kts

      - name: Commit and Push Changes
        run: |
          git add app/build.gradle.kts
          git commit -m "chore: bump version to ${{ inputs.version_name }}"
      - name: Create and Push Tag
        run: |
          TAG_NAME="v${{ inputs.version_name }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME


